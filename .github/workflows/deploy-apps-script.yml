name: Deploy Apps Script

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install --global markdownlint-cli@0.50.0
      - run: make check
      - name: Update existing installation and verify readback
        env:
          DEPLOY_AUTH_JSON: ${{ secrets.DEPLOY_AUTH_JSON }}
          DEPLOY_TARGET_JSON: ${{ secrets.DEPLOY_TARGET_JSON }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/deploy.py
